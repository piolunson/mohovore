name: attach-release-asset

on:
  push:
    paths:
      - '.github/workflows/attach-release-asset.yml'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l homovore3/dist/homovore-3-1.0.0.jar
          gh release upload v1.0.0 homovore3/dist/homovore-3-1.0.0.jar --clobber
          gh release view v1.0.0 --json assets --jq '.assets[] | "\(.name) \(.size)"'
